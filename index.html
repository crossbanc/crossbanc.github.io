<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero with Footer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Hero section */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    .hero img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Footer */
    footer {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }

    footer a {
      color: #00bcd4;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <img src="images/hero.png" alt="Hero Image" />
  </section>

  <!-- Footer -->
  <footer>
      <br>
      <br>
      <br>
      <br>
    <p>&copy; 2025 Crossbanc. Crossbanc Pte. Ltd. All rights reserved.</p>
  </footer>
</body>
</html>
